[Unit]
# Ensure ap0 has its IP before dnsmasq tries to bind.
After=openmarquee-ap0.service
Wants=openmarquee-ap0.service

[Service]
# Re-run ap0 setup before dnsmasq start so we self-heal if ap0's IP
# got flushed since the original boot-time setup. The `-` prefix means
# don't fail dnsmasq if the script returns non-zero (e.g. ap0 was
# already healthy). Idempotent: the script does `ip addr flush` before
# `ip addr add` so re-running on a healthy ap0 is safe.
ExecStartPre=-/opt/openmarquee/system/openmarquee-ap0-setup.sh
