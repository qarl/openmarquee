[Service]
# Phase 4r drop-in: append stdout + stderr to a dedicated persistent
# file so firstboot.service output survives even if journald state
# is lost on a Restart=on-failure cycle that the SD card never
# committed the journal-flush for. The journal still gets the same
# output (StandardOutput=append: is in addition to journal capture
# for a Type=oneshot unit when not explicitly overriding to socket/
# tty). chmod-mode is left to systemd-tmpfiles / default umask —
# this file is root-only on Pi anyway.
StandardOutput=append:/var/log/openmarquee-firstboot.log
StandardError=append:/var/log/openmarquee-firstboot.log
