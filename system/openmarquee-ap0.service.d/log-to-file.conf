[Service]
# Phase 4r drop-in: append stdout + stderr to a dedicated persistent
# file so the openmarquee-ap0-setup.sh output survives reboots. This
# unit creates the ap0 interface BEFORE NetworkManager starts (per
# its Before= ordering); failures here cascade into hostapd never
# having an interface to bind. The log file gives us direct visibility.
StandardOutput=append:/var/log/openmarquee-ap0.log
StandardError=append:/var/log/openmarquee-ap0.log
