# openMarquee DHCP + DNS-intercept config.
#
# This is what turns the device into a captive portal per SYSTEM_SPEC §4.2:
# every DNS lookup resolves to the device's own IP, so any URL the phone
# tries to reach redirects to the openMarquee setup UI.
#
# Install:
#     sudo cp system/dnsmasq.conf /etc/dnsmasq.d/openmarquee.conf
#     sudo systemctl enable --now dnsmasq

# Bind only to the AP interface (ap0, the virtual one created by
# openmarquee-ap0.service). `wlan0` — the physical radio — may be joined
# to the operator's home WiFi for Tailscale / remote management, and we
# emphatically don't want to serve DHCP / intercept DNS over there.
interface=ap0
bind-interfaces

# Don't use /etc/resolv.conf — we're the authoritative (and only) resolver
# on this network.
no-resolv

# The device itself serves DHCP in the 10.0.0.x range per SYSTEM_SPEC §4.1.
# .1 is reserved for the device; .2–.50 is the phone lease pool. 12-hour
# leases are plenty — the phone just needs an IP long enough to open the UI.
dhcp-range=10.0.0.2,10.0.0.50,12h
dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1

# Captive-portal DNS intercept: every hostname resolves to 10.0.0.1 (us).
# Combined with the HTTP responder on port 80, this triggers the
# "captive portal detected" flow on iOS, Android, Windows, and macOS.
address=/#/10.0.0.1

# No logging of individual queries — reduces SD-card wear.
log-queries=no
# `quiet-dhcp` is a flag option, not key=value. Writing it as
# `quiet-dhcp=yes` makes dnsmasq error with `extraneous parameter`
# at startup and refuse to bind UDP 67 (verified live on debug Pi
# 2026-05-16). Note `dnsmasq --test` does NOT catch this — only
# the runtime config parser does. The bare form is correct.
quiet-dhcp
