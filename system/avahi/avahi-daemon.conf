# /etc/avahi/avahi-daemon.conf — openMarquee configuration.
#
# Copied verbatim to /etc/avahi/avahi-daemon.conf by scripts/install.sh
# on install.sh runs AND by the image build (00-install-packages
# stage stashes it after apt lays down the stock Debian conf).
#
# Only the keys that matter for our story are set; everything else
# is left at Debian defaults + not repeated here so an upstream
# default change isn't fought.
#
# Per qa/spec-onboarding-ap-sta-concurrent-2026-06-10.md §"Finding
# the device after onboarding" #1: openmarquee.local must resolve
# from any device on the same LAN as the sign after AP teardown.
# Two overrides do the work:
#
#   1. host-name=openmarquee — announces openmarquee.local (A record)
#      regardless of the per-device /etc/hostname (which
#      cloud-init randomizes to openmarquee-<4-hex> to avoid
#      collisions in a fleet). Avahi handles collisions on the
#      LAN itself (openmarquee-2.local etc.), so multiple signs
#      on the same subnet don't clobber each other.
#
#   2. allow-interfaces=wlan0 — advertise ONLY on the STA/home
#      interface. ap0 (openmarquee-ap0.service) is the setup AP
#      and gets torn down at LINGER->ONLINE; deliberately excluding
#      it avoids dual-advertising during the SETUP overlap window
#      where wlan0 already has an IP but ap0 is still up. The wlan0
#      advert survives AP teardown because wlan0 stays up.
#
# domain-name=local is the mDNS default; not overridden.
# use-ipv4=yes / use-ipv6=yes are defaults; not overridden.
# publish-hinfo=no is Debian's default; not overridden.

[server]
host-name=openmarquee
allow-interfaces=wlan0

# 2026-07-01: no [wide-area]/[reflector]/[rlimits] tweaks yet — the
# Debian defaults are fine for a single-subnet home network. If a
# multi-subnet enterprise deployment ever needs unicast wide-area
# mDNS, that config lives here.
