# openMarquee station-mode (home WiFi) config for `wlan0`.
#
# This is read by `wpa_supplicant` when the operator has filled in home
# WiFi credentials via the Settings UI (Phase 7 oneshot templates their
# values into this file and restarts the supplicant).
#
# The sibling `ap0` interface — created by openmarquee-ap0.service —
# hosts the captive-portal AP independently. Both share the physical
# BCM43438 radio; see system/README.md for the channel-sharing caveat.
#
# Install path:
#     /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
# Service:
#     sudo systemctl enable --now wpa_supplicant@wlan0

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=US

# First-boot template: empty. The device's Settings UI writes one
# `network={…}` block here once the operator supplies credentials.
# Bookworm's NetworkManager can also manage wlan0 directly — in that
# case this file is unused and NM's keyfile at
# /etc/NetworkManager/system-connections/ is the source of truth.

# Example block (what the Phase 7 settings-apply oneshot injects):
#
# network={
#     ssid="home-wifi-name"
#     psk="home-wifi-passphrase"
#     # key_mgmt / priority default to sensible values; uncomment to
#     # override if the home network needs a specific shape.
# }
