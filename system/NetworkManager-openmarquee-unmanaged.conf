# NetworkManager drop-in: keep ap0 out of NM's hands entirely.
#
# Installed by scripts/install.sh to /etc/NetworkManager/conf.d/openmarquee-unmanaged.conf.
#
# Background. The openMarquee captive-portal AP runs on `ap0`, a virtual
# __ap-type interface created on the same physical radio (BCM43438) that
# wlan0 lives on. hostapd owns ap0; NetworkManager owns wlan0. If NM also
# tries to manage ap0, two problems surface:
#
#   1. NM discovers ap0 as a wifi device on appearance and tries to
#      activate the user's pre-configured WiFi keyfile on it (because
#      the keyfile has no `interface-name=` pin to wlan0). That keyfile
#      is intended for STA-mode joining the operator's home WiFi, not
#      AP-mode broadcasting on ap0.
#
#   2. The brcmfmac driver panics with `setting AP mode failed -52`
#      while NM is mid-flight switching ap0 from AP to STA mode.
#      Regulatory domain thrashes to WORLD. Both the AP and the STA
#      side collapse. Verified by subagent against journal evidence
#      from boot 9 (2026-05-16).
#
# Earlier attempts. system/openmarquee-ap0-setup.sh used to call
# `nmcli dev set ap0 managed no` to achieve the same goal. That fails
# silently when openmarquee-ap0.service runs Before=NetworkManager (NM
# is not yet up to receive the command). This conf.d drop-in is read
# by NM at startup, so the directive is in place before NM ever sees
# ap0.

[keyfile]
unmanaged-devices=interface-name:ap0
