# openMarquee — systemd-tmpfiles definitions.
#
# P1.2-B.3 (2026-06-10): create /run/openmarquee/ owned by
# root:openmarquee mode 0750 so the backend (member of group
# openmarquee) can traverse to /run/openmarquee/netctl.sock at
# boot.
#
# QA's P1.2-B.2 verify caught this: openmarquee-netctl.socket's
# DirectoryMode=0750 made systemd create the parent directory
# but the OWNER was inherited from PID 1 (root:root), so the
# backend user couldn't reach the socket file inside. With this
# tmpfiles.d entry, the directory exists with the right
# ownership BEFORE the socket binds, and the socket file
# (SocketUser=root SocketGroup=openmarquee SocketMode=0660) is
# reachable through the parent dir.
#
# Installed by scripts/install.sh to /etc/tmpfiles.d/openmarquee.conf;
# applied immediately via `systemd-tmpfiles --create` so the
# socket can bind without a reboot.
#
# Format: type path mode user group age argument
#   d = create directory, set perms+ownership
#   - = no expiration (don't auto-delete)
d /run/openmarquee 0750 root openmarquee -
