# openMarquee — reduce swap aggressiveness on the Pi Zero 2 W.
#
# The sign runs a large text/video working set against a slow SD card.
# The stock vm.swappiness=60 lets the kernel evict warm anonymous pages
# to swap under memory pressure, and the resulting page-ins during the
# text reel stall the render loop (SD-swap-thrash). swappiness=10 keeps
# the kernel biased toward reclaiming page cache before it swaps anon
# pages, which measurably smooths the reel without disabling swap
# entirely (still available as a last resort before the OOM killer).
#
# Installed to /etc/sysctl.d/ by scripts/install.sh (+ `sysctl --system`).
# Handover reconcile 2026-07-09 (GAP7): folds the deploy-only live value.
vm.swappiness=10
