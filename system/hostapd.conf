# openMarquee WiFi access point config.
#
# Install:
#     sudo cp system/hostapd.conf /etc/hostapd/hostapd.conf
#     sudo systemctl enable --now hostapd
#
# Phase 7 substitutes the SSID suffix (from the board's MAC address) and
# rotates the password at first boot — the placeholders below are what a
# freshly-flashed SD card ships with.

# We bind hostapd to `ap0` — a SECOND virtual interface created on the
# same physical BCM43438 radio by `openmarquee-ap0.service`. This lets
# the device host the captive-portal AP AND simultaneously join a home
# WiFi on `wlan0` for remote management / Tailscale.
#
# Constraint inherent to single-radio AP+STA: both virtual interfaces
# share the one physical antenna and MUST run on the same channel.
# When `wlan0` associates with a home WiFi on e.g. ch 11, the kernel
# forces ap0 onto ch 11 too. The `channel` line below is therefore a
# *preference*, not a guarantee — it applies only when wlan0 has no
# station association. Phase 9's image builder can scan + pick an
# unused channel at first boot for the no-station case.
interface=ap0
driver=nl80211

hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# Network name. Phase 7 substitutes a MAC-derived suffix ("openMarquee-A3F7").
ssid=openMarquee-SETUP

# Open network with WPA2 — users need SOME barrier to keep random strangers
# off the captive-portal UI of their sign, but a default password is fine
# because each device rotates to a unique one at first boot.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# Placeholder password. Phase 7 rotates this per-device at first boot and
# displays the real value (plus a QR code encoding it) on the welcome
# screen. If you see this string on a real sign, provisioning failed.
wpa_passphrase=change-me-at-first-boot

# Don't announce anything fancy.
beacon_int=100
dtim_period=2
