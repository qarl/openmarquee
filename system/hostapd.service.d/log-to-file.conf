[Service]
# Diagnostic drop-in: append hostapd's stdout + stderr to a dedicated
# persistent file. The ExecStartPre below also dumps the config
# hostapd is ACTUALLY about to read (with passphrase redacted) so we
# can correlate the templated /etc/hostapd/hostapd.conf against
# whatever $DAEMON_CONF (from /etc/default/hostapd) points at. Boot
# 8 broadcast empty SSID despite hostapd.conf being correctly
# templated — this drop-in answers whether hostapd was reading the
# config we think it was.
StandardOutput=append:/var/log/hostapd.log
StandardError=append:/var/log/hostapd.log
ExecStartPre=/bin/sh -c 'printf "\n=== hostapd starting at %s ===\nDAEMON_CONF=%s\n--- config (passphrase redacted) ---\n" "$(date -Iseconds)" "$DAEMON_CONF" >> /var/log/hostapd.log; sed -E "s|^(wpa_passphrase=).*|\\1REDACTED|" "$DAEMON_CONF" >> /var/log/hostapd.log 2>&1 || echo "(config read failed)" >> /var/log/hostapd.log'
# Tighten /var/log/hostapd.log to 0600 before each hostapd start:
# -dd debug verbosity below logs the wpa_passphrase plaintext to the
# runtime debug stream (the existing ExecStartPre's config dump is
# regex-redacted but -dd output is not). 0600 matches wifi.json's
# mode + the install/firstboot xtrace logs. The first ExecStartPre
# above already created the file via `>>` redirect, so chmod won't
# ENOENT; defensive `|| true` covers the edge case anyway.
ExecStartPre=/bin/sh -c 'chmod 600 /var/log/hostapd.log 2>/dev/null || true'
# Verbose hostapd: -dd doubles the debug verbosity (every state
# transition, beacon attempt, association event). The package's
# default unit at /usr/lib/systemd/system/hostapd.service has
# ExecStart=/usr/sbin/hostapd -B -P /run/hostapd.pid $DAEMON_OPTS
# ${DAEMON_CONF} — so setting DAEMON_OPTS via Environment= here
# directly takes effect. /etc/default/hostapd does NOT set
# DAEMON_OPTS on stock trixie (verified against boot-8 rootfs),
# so this drop-in's Environment= is unambiguous. Same passphrase-
# leak surface as the firstboot.sh set -x precedent (mitigated by
# log being root-readable only).
Environment=DAEMON_OPTS=-dd
