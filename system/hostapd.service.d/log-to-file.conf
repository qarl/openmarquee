[Service]
# Phase 4r drop-in: append hostapd's stdout + stderr to a dedicated
# persistent file. The ExecStartPre below also dumps the config
# hostapd is ACTUALLY about to read (with passphrase redacted) so we
# can correlate the templated /etc/hostapd/hostapd.conf against
# whatever $DAEMON_CONF (from /etc/default/hostapd) points at. Boot
# 8 broadcast empty SSID despite hostapd.conf being correctly
# templated — this drop-in answers whether hostapd was reading the
# config we think it was.
StandardOutput=append:/var/log/hostapd.log
StandardError=append:/var/log/hostapd.log
ExecStartPre=/bin/sh -c 'printf "\n=== hostapd starting at %s ===\nDAEMON_CONF=%s\n--- config (passphrase redacted) ---\n" "$(date -Iseconds)" "$DAEMON_CONF" >> /var/log/hostapd.log; sed -E "s|^(wpa_passphrase=).*|\\1REDACTED|" "$DAEMON_CONF" >> /var/log/hostapd.log 2>&1 || echo "(config read failed)" >> /var/log/hostapd.log'
