name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend with dev extras
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Ruff lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: pip-audit
        working-directory: backend
        run: pip-audit -r requirements.lock
      - name: Lock drift check
        working-directory: backend
        run: |
          pip-compile --quiet --strip-extras pyproject.toml -o - 2>/dev/null \
            | diff -u requirements.lock -
      - name: Pytest
        working-directory: backend
        run: pytest

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: esbuild bundle
        working-directory: ui
        run: npm run build
      - name: Vitest
        working-directory: ui
        run: npm test --silent

  renderer:
    # 16.4 / sweep #8 B6: cargo test for the host-portable surfaces
    # (parse_color, hdmi_logic, content.rs, etc.). Use macos-latest so
    # the Linux-only drm/gbm/khronos-egl deps stay cfg-gated off --
    # ubuntu-latest would need apt-get install libdrm-dev libgbm-dev
    # libegl1-mesa-dev to even compile. macOS host-test was the design
    # point per Cargo.toml's comment block at the Linux-only target.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: renderer
        run: cargo test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        working-directory: ui
        run: npm run e2e
      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
