[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openmarquee"
version = "0.7.0-rc.1"
description = "Self-contained, phone-controlled, no-subscription digital signage platform"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "openMarquee contributors" },
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # Pillow + aiortc pinned exactly (sweep #5 #7). Both have had
    # CVE drumbeat 2024-25 (Pillow image-decoder bugs, aiortc/
    # WebRTC stack). Lock to a known-good version; bump
    # intentionally through pip-audit + a fresh lockfile generation
    # rather than letting `>=` drift silently.
    "pillow==12.2.0",
    "aiortc==1.14.0",
    # numpy is a hard dep of stream.py's `frame.to_ndarray(format='rgb24')`.
    # PyAV declares numpy as optional, so without this entry a fresh
    # setup.sh fails test collection at tests/test_stream.py with
    # ModuleNotFoundError: numpy. Caught by Jimmy-openmarquee-qa
    # post-Phase-12.1 verification.
    "numpy>=2.0",
    # flock_sync.py imports httpx at module level (the AsyncClient for
    # peer-to-peer sync calls). Was previously only in `dev`, which
    # broke fresh device deploys with ModuleNotFoundError on import of
    # openmarquee.dependencies (which pulls in flock_sync) -- caught
    # 2026-05-05 during the openmarquee-dev.local provisioning.
    "httpx>=0.27",
    # Batch 20.1 / phase A.1 -- argon2id password hashing for the
    # operator-set captive-portal password. argon2-cffi is the
    # standard binding; default PasswordHasher() params (time_cost=
    # 3, memory_cost=64MiB, parallelism=4) verify in ~50ms on Pi
    # Zero 2 W and write a self-describing $argon2id$ string the
    # PHC format gives us forward-compat across param tweaks.
    "argon2-cffi>=23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    # Lockfile + CVE-audit tooling. pip-compile (from pip-tools)
    # regenerates requirements.lock from pyproject.toml; pip-audit
    # gates pre-deploy on CVE findings against the lockfile. Both
    # are dev-only -- the device runs from the generated lockfile.
    #
    # pip-tools is EXACT-pinned (==) -- the lock-drift check in
    # test.sh / CI runs `pip-compile ... | diff requirements.lock`,
    # and pip-tools version differences across dev/CI produce
    # spurious diffs in the header comment block. Pinning eliminates
    # that. Bump in lockstep with a re-run of pip-compile + commit
    # of the updated requirements.lock.
    #
    # Bumped 2026-05-24: 7.4.1 → 7.5.3. pip 26 removed the
    # `PackageFinder.allow_all_prereleases` attribute that pip-tools
    # 7.4.x relied on; pip-compile crashes with AttributeError on any
    # host that has pip >= 26. 7.5.0 added the compat shim. Floor for
    # any future bump is 7.5.0; staying EXACT-pinned keeps the lock-
    # drift check immune to header churn across dev/CI.
    #
    # DO NOT loosen this pin to chase a pip-audit CVE alert against
    # pip-tools 7.5.x — bump the exact version instead. Loosening
    # would reintroduce header churn in requirements.lock across
    # dev/CI and re-open the lock-drift gate to false positives.
    "pip-tools==7.5.3",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openmarquee*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "hardware: requires real Pi hardware to run (skipped by default)",
]
addopts = "-m 'not hardware'"
