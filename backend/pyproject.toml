[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openmarquee"
version = "0.0.0"
description = "Self-contained, phone-controlled, no-subscription digital signage platform"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "openMarquee contributors" },
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pillow>=10.0",
    "aiortc>=1.9",
    # numpy is a hard dep of stream.py's `frame.to_ndarray(format='rgb24')`.
    # PyAV declares numpy as optional, so without this entry a fresh
    # setup.sh fails test collection at tests/test_stream.py with
    # ModuleNotFoundError: numpy. Caught by Jimmy-openmarquee-qa
    # post-Phase-12.1 verification.
    "numpy>=2.0",
    # flock_sync.py imports httpx at module level (the AsyncClient for
    # peer-to-peer sync calls). Was previously only in `dev`, which
    # broke fresh device deploys with ModuleNotFoundError on import of
    # openmarquee.dependencies (which pulls in flock_sync) -- caught
    # 2026-05-05 during the openmarquee-dev.local provisioning.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openmarquee*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "hardware: requires real Pi hardware to run (skipped by default)",
]
addopts = "-m 'not hardware'"
