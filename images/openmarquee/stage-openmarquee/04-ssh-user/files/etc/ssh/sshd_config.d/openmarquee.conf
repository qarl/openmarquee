# /etc/ssh/sshd_config.d/openmarquee.conf — SSH hardening for shipped
# openMarquee devices. Baked into the SD image by the stage-openmarquee
# 04-ssh-user substage so the lockdown is present on a fresh card
# INDEPENDENT of cloud-init (cloud-init's `ssh_pwauth: false` is the belt;
# this image-level drop-in is the canonical suspenders).
#
# Login is key-only as the `openmarquee` user (the sole SSH identity on a
# shipped device); no passwords, no root login. sshd is FIRST-match-wins, and
# Debian/Pi OS place `Include /etc/ssh/sshd_config.d/*.conf` at the TOP of the
# main sshd_config — so these drop-in values are read first and win.
PasswordAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
