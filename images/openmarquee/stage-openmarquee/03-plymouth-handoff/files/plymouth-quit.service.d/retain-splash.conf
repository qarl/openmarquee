# openMarquee boot splash — hand off to the renderer with no black
# flash.
#
# The stock plymouth-quit.service runs `plymouth quit`, which tears
# the splash down and leaves a BLACK screen until the renderer paints
# its first frame — and that happens several seconds later, after the
# backend + AP services finish coming up.
#
# `--retain-splash` instead leaves the splash framebuffer on screen:
# plymouth exits and releases DRM, but KMS keeps scanning out the
# last splash frame until the renderer's first modeset / page-flip
# replaces it. No black gap — the spinner simply freezes for the last
# few seconds of boot, then the renderer's first frame takes over.
#
# A drop-in (not a unit replacement): the empty `ExecStart=` clears
# the stock command, the second line sets ours. The leading `-`
# keeps the unit from failing if plymouth is already gone.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
