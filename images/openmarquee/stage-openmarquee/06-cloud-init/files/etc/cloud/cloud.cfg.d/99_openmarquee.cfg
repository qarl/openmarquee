# 99_openmarquee.cfg — force the NoCloud datasource and seed it from the
# FAT boot partition.
#
# FIRST-LIGHT FIX 2026-09-19: on the first burned card, cloud-init never
# consumed the staged seed — empty /var/log/cloud-init.log, stock
# `raspberrypi` hostname, no bundle extract, black screen. Two gaps caused
# it; this file closes the datasource half (the 06-run.sh substage runner
# enables the cloud-init systemd units — the other half).
#
# Debian / RPi-OS cloud-init does NOT auto-seed from the boot partition the
# way Ubuntu's Pi images do, so without this drop-in the NoCloud
# user-data / meta-data / network-config that scripts/stage_sd_card.sh
# writes to the boot partition (bootfs, mounted at /boot/firmware on
# trixie) are never read.
#
# The trailing slash on `seedfrom` is REQUIRED: cloud-init appends
# `user-data`, `meta-data`, and `network-config` directly to the seedfrom
# value, so it must resolve to `file:///boot/firmware/user-data` etc.
datasource_list: [ NoCloud ]
datasource:
  NoCloud:
    seedfrom: file:///boot/firmware/
