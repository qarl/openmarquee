[package]
name = "openmarquee-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "openMarquee renderer — Rust sidecar that drives HDMI/HUB75/WS2812B"
license = "MIT"
publish = false

[dependencies]
# CLI parsing.
clap = { version = "4.5", features = ["derive"] }

# Error handling.
anyhow = "1.0"
thiserror = "1.0"

# Structured logging — journald-friendly when systemd-managed.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 1 hardware path: DRM/KMS atomic + GBM scanout + EGL/GLES2.
drm = "0.12"
gbm = "0.15"
khronos-egl = { version = "6.0", features = ["dynamic"] }
libloading = "0.8"
glow = "0.14"

[[bin]]
name = "openmarquee-render"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
