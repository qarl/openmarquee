[package]
name = "openmarquee-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "openMarquee renderer — Rust sidecar that drives HDMI/HUB75/WS2812B"
license = "MIT"
publish = false

[dependencies]
# Phase 1 keeps the dep set as small as possible — pulling in
# tracing-subscriber/glow/khronos-egl/gbm before we need them caused
# zigbuild dep-graph hangs. They come back as the relevant phases
# land.

# CLI parsing.
clap = { version = "4.5", features = ["derive"] }

# Error handling.
anyhow = "1.0"

# Phase 1 hardware path: DRM/KMS only. GBM + EGL + GLES come once
# probe -> render-frame milestone is reached.
drm = "0.12"

# Phase 2 — pixels on screen via GBM scanout + EGL + GLES2 single
# fullscreen quad. `gbm` default features pull in wayland-server
# which we don't need for direct-DRM scanout; the `import-egl`
# feature exposes gbm_bo_get_fd / EGLImage import for the
# eventual H.264 dmabuf path.
gbm = { version = "0.15", default-features = false, features = ["import-egl"] }

# `dynamic` keeps libEGL.so loaded at runtime instead of linked at
# build, so the binary works against whatever Mesa version the Pi
# happens to have.
khronos-egl = { version = "6.0", features = ["dynamic"] }
libloading = "0.8"

# GLES2 function bindings. glow handles the function-pointer dance;
# we provide it the EGL loader.
glow = "0.14"

[[bin]]
name = "openmarquee-render"
path = "src/main.rs"

[profile.release]
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
