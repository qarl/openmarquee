[package]
name = "openmarquee-render"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "openMarquee renderer — Rust sidecar that drives HDMI/HUB75/WS2812B"
license = "MIT"
publish = false

[dependencies]
# Cross-platform deps used by both the binary and host-side tests.
# Pure Rust, link clean on macOS for `cargo test`.
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# libc — POSIX bindings. UNCONDITIONAL (was Linux-only): Bug 1
# follow-up (2026-05-20) added `unix_to_calendar_local` in the
# host-testable hdmi_logic.rs, which calls libc localtime_r /
# tzset. libc is pure bindings — zero link-time deps, compiles
# clean on macOS — so the tz resolver + its unit tests run on
# the Mac `cargo test` gate. The Linux-only HW deps (drm/gbm/
# EGL) still gate hdmi.rs separately below.
libc = "0.2"

# Phase 4 — playlist + content JSON. Pre-approved in plan §2.
# Pure Rust, no link deps; works fine on Mac for tests.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `default-features=false` drops the wasm-bindgen / js-sys / web-sys /
# bumpalo / futures-util dep chain that uuid pulls in for browser
# targets. We only need serde derive on aarch64-unknown-linux-gnu.
uuid = { version = "1", default-features = false, features = ["serde"] }

# Phase 4.2 — text glyph rasterization. Pre-approved in plan §2.
# Pure Rust, cross-platform. Single-glyph rasterizer + simple line
# layout; cosmic-text (also in plan §2) is held back for now since
# FYS is English-ASCII — fontdue alone covers it. Add cosmic-text
# if we hit a slide that needs shaping/bidi/ligatures.
fontdue = "0.9"

# Bug 3 Slice 1 (2026-05-19) — runtime glyph cache mpsc channel.
# crossbeam-channel's select! macro is the work-distribution
# primitive for the worker thread pool. Pure Rust, cross-platform.
crossbeam-channel = "0.5"

# Bug 3 Slice 1 part B (2026-05-19) — runtime MSDF rasterization
# for the dynamic glyph cache. Promoted from [build-dependencies]
# now so Slice 2 is a pure logic swap (stub worker → real msdfgen
# call) without further Cargo.toml moves. msdfgen wraps Chlumsky's
# C++ msdfgen via cc; build host needs a C++ compiler (already
# required for the build.rs bake). Cross-build to aarch64 verified
# via cargo-zigbuild from /tmp/renderer-build.
#
# `ttf-parser` feature pulls glyph-shape extraction; pinned to
# 0.18 (the version msdfgen 0.2.1's FontExt impls bind to).
msdfgen = { version = "0.2", features = ["ttf-parser"] }
ttf-parser = "0.18"

# Bug 3 Slice 3A.rev (2026-05-19) — runtime COLRv1 vector emoji
# rasterizer. Initial Slice 3A surface bounced after discovering
# swash 0.2.7 (the dispatch's suggested dep) only implements the
# COLRv0 layer record format; NotoColorEmoji-Regular is COLRv1,
# so swash's color path returns no layers. QA-approved Path A:
# skrifa (Google's pure-Rust font reader; full COLRv1 paint-tree
# traversal via the ColorPainter trait) + tiny-skia (pure-Rust
# Skia subset; gradients, transforms, clip stacks, blend modes).
# Both cross-build cleanly to aarch64 via zigbuild — no system
# deps.
#
# Replaces the static build-time CBDT emoji atlas (sdf_atlas_
# emoji.rs) over Slices 3B-3D. 3A is module skeleton + worker
# RenderMode dispatch only; no caller emits RenderMode::Colr yet
# (layout dispatch hook lands in 3B).
skrifa = "0.40"
# `png-format` enables image loading from PNG which we don't use
# (we paint into a Pixmap directly and read pixels back as RGBA).
# Dropping it avoids pulling png 0.18 alongside our existing png
# 0.17 dep used by ImageSlide. `simd` stays on — it gates NEON-
# accelerated raster paths on aarch64 (Pi target enables
# target_feature="neon" by default) and SSE2/AVX2 on x86_64 host
# builds; codepaths are cfg-gated so non-SIMD targets still build.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

# v1-spec-delta #8 (slice a) — ImageSlide rendering. The browser
# pre-scales operator uploads to PNG at the panel's native
# resolution (per backend ImageSlide docstring), so the renderer
# only ever sees PNG. Pure Rust, cross-platform. Pre-approved by
# QA in slice (a) framing. `png` is lighter than `image` and
# covers the only format we need.
png = "0.17"

# Hardware-bring-up deps (drm/gbm/EGL/GLES2) are Linux-only — they
# require libdrm, libgbm, libEGL at link time, none of which exist
# on macOS. Gating them behind cfg(target_os="linux") keeps
# `cargo test` runnable on the Mac dev box for the pure-logic
# surfaces (parse_color, hdmi_logic, etc.) per the QA test gate.
[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.12"
gbm = { version = "0.15", default-features = false, features = ["import-egl"] }
khronos-egl = { version = "6.0", features = ["dynamic"] }
libloading = "0.8"
glow = "0.14"
# v1-spec-delta F1d (V1-GA-blocker, 2026-05-08): poll(2) syscall
# wrapper for the page-flip-event drain timeout. drm-rs's
# receive_events is not non-blocking; without a poll-gated wrapper
# the renderer hangs forever on a HW vblank miss. libc itself is
# now declared unconditionally up in [dependencies] (Bug 1
# follow-up) — hdmi.rs's poll(2) use is covered by that.
# v1-spec-delta #17 (slice b, 2026-05-08): drm-ffi exposes
# drm_mode_modeinfo so we can synthesize a CEA-861 1920x1080 Mode
# for --force-mode (project-memory: dev Pi EDID is 0 bytes; safe-
# mode list tops out at 1024x768). drm-ffi is already in the dep
# tree transitively via drm-rs; this declaration just exposes the
# struct. Same major version drm-rs links against to avoid layout
# drift.
drm-ffi = "0.8"
# V4L2 piece 2a (2026-05-14): typed ioctl macros for the V4L2 M2M
# H.264 decoder client (src/v4l2.rs). `nix::ioctl_read!` / similar
# compute the ioctl number (size + dir + nr + type) from the Rust
# struct's size at compile time, so the in-Rust struct definition
# of V4l2Capability et al. has to match the kernel's <linux/
# videodev2.h> byte-for-byte. Nix's `ioctl` feature is what we
# need; the crate's default features pull in a lot of other Linux
# syscall wrappers we don't use.
nix = { version = "0.29", features = ["ioctl"], default-features = false }

[dev-dependencies]
# Integration tests for content.rs's file-IO wrappers.
tempfile = "3"
# Bug 3 Slice 1 part B (2026-05-19): msdfgen + ttf-parser are now in
# [dependencies] (promoted for runtime use by the glyph cache worker).
# The bench example reaches the same crates through [dependencies]
# transitively — no [dev-dependencies] entry needed.

# SDF arc slice A — build-time MSDF atlas generation. msdfgen is a
# safe Rust wrapper around Chlumsky's C++ msdfgen (vendored in
# msdfgen-sys via the `cc` crate; no system install needed, but a
# C++ compiler is required at HOST build time). Runs on the build
# machine (macOS dev, CI), emits atlas blobs into OUT_DIR which the
# binary `include_bytes!`'s in at runtime. Cross-compile to aarch64
# never invokes msdfgen on aarch64 — the blobs are already baked
# into the binary on the build host.
#
# `ttf-parser` feature gives glyph-shape extraction directly from
# .ttf bytes; no FreeType FFI needed.
[build-dependencies]
msdfgen = { version = "0.2", features = ["ttf-parser"] }
# Pin to 0.18 because msdfgen 0.2.1 declares `ttf-parser = "0.18"` and
# its FontExt::glyph_shape impl is bound to that exact major version.
# Using 0.19 here gets a separate Face type and the FontExt trait
# doesn't apply -- build.rs won't compile.
ttf-parser = "0.18"
# Slice C.1: decode CBDT PNG payloads + re-encode packed emoji atlases
# at build time. Pinned to runtime's 0.17 so build-host and target
# decoder agree (PNG round-trips should be bit-stable).
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "openmarquee-render"
path = "src/main.rs"

# 2026-06-17 QA M0 dispatch — headless V4L2 park-and-resume probe.
# Standalone binary that imports v4l2 / mp4_demux / video_decode
# via #[path] inside its own root, so reuse is read-only without
# requiring the openmarquee-render binary crate to expose a lib.
# Linux-only: V4L2 ioctls aren't available on macOS so the binary
# is a no-op stub there (`cargo build` succeeds on dev; only the
# aarch64 cross-build produces a runnable probe).
[[bin]]
name = "m0-park-resume-probe"
path = "src/bin/m0_park_resume_probe.rs"

[profile.release]
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
