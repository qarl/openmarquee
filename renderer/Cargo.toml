[package]
name = "openmarquee-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "openMarquee renderer — Rust sidecar that drives HDMI/HUB75/WS2812B"
license = "MIT"
publish = false

[dependencies]
# Cross-platform deps used by both the binary and host-side tests.
# Pure Rust, link clean on macOS for `cargo test`.
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# Phase 4 — playlist + content JSON. Pre-approved in plan §2.
# Pure Rust, no link deps; works fine on Mac for tests.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `default-features=false` drops the wasm-bindgen / js-sys / web-sys /
# bumpalo / futures-util dep chain that uuid pulls in for browser
# targets. We only need serde derive on aarch64-unknown-linux-gnu.
uuid = { version = "1", default-features = false, features = ["serde"] }

# Phase 4.2 — text glyph rasterization. Pre-approved in plan §2.
# Pure Rust, cross-platform. Single-glyph rasterizer + simple line
# layout; cosmic-text (also in plan §2) is held back for now since
# FYS is English-ASCII — fontdue alone covers it. Add cosmic-text
# if we hit a slide that needs shaping/bidi/ligatures.
fontdue = "0.9"

# Hardware-bring-up deps (drm/gbm/EGL/GLES2) are Linux-only — they
# require libdrm, libgbm, libEGL at link time, none of which exist
# on macOS. Gating them behind cfg(target_os="linux") keeps
# `cargo test` runnable on the Mac dev box for the pure-logic
# surfaces (parse_color, hdmi_logic, etc.) per the QA test gate.
[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.12"
gbm = { version = "0.15", default-features = false, features = ["import-egl"] }
khronos-egl = { version = "6.0", features = ["dynamic"] }
libloading = "0.8"
glow = "0.14"

[dev-dependencies]
# Integration tests for content.rs's file-IO wrappers.
tempfile = "3"

[[bin]]
name = "openmarquee-render"
path = "src/main.rs"

[profile.release]
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
