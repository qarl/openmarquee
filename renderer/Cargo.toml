[package]
name = "openmarquee-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "openMarquee renderer — Rust sidecar that drives HDMI/HUB75/WS2812B"
license = "MIT"
publish = false

[dependencies]
# Phase 1 keeps the dep set as small as possible — pulling in
# tracing-subscriber/glow/khronos-egl/gbm before we need them caused
# zigbuild dep-graph hangs. They come back as the relevant phases
# land.

# CLI parsing.
clap = { version = "4.5", features = ["derive"] }

# Error handling.
anyhow = "1.0"

# Phase 1 hardware path: DRM/KMS only. GBM + EGL + GLES come once
# probe -> render-frame milestone is reached.
drm = "0.12"

[[bin]]
name = "openmarquee-render"
path = "src/main.rs"

[profile.release]
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
