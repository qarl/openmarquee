[toolchain]
# Match the OLD renderer's pin (1.85). Stable enough for clap 4.5
# derive + edition2024 in transitive deps. Pin the channel so the
# Pi-side build sees the same compiler as the macOS-host
# cross-build.
channel = "1.85.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-gnu"]
