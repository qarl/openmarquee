[package]
name         = "blendr"
version      = "0.0.1"
edition      = "2021"
rust-version = "1.85"

[dependencies]
anyhow     = "1.0"
clap       = { version = "4.5", features = ["derive"] }
libc       = "0.2"
log        = "0.4"
env_logger = "0.11"

# Linux-only HW deps. Cfg-gating preserves macOS `cargo check`
# for the pure-logic surfaces (probe scoring tests). The actual
# kernel/HW dance happens only when built for aarch64-linux.
[target.'cfg(target_os = "linux")'.dependencies]
drm         = "0.12"
drm-ffi     = "0.8"
gbm         = { version = "0.15", default-features = false, features = ["import-egl"] }
khronos-egl = { version = "6.0", features = ["dynamic"] }
glow        = "0.14"
nix         = { version = "0.29", features = ["signal", "poll", "ioctl"], default-features = false }

# Phase 1: GStreamer interop (decode -> appsink -> GL texture).
# Requires the Pi sysroot to have libgstreamer-1.0-dev headers
# + pkgconfig (apt: libgstreamer1.0-dev libgstreamer-plugins-
# base1.0-dev libgstreamer-gl1.0-dev). If the cross-build fails
# with "pkg-config exited with status code 1 (Could not find ...
# gstreamer-1.0.pc)", mirror these from a Bookworm Pi:
#   rsync -avz <pi>:/usr/include/{gstreamer-1.0,glib-2.0} \
#     ~/pi-sysroot/usr/include/
#   rsync -avz <pi>:/usr/lib/aarch64-linux-gnu/glib-2.0 \
#     ~/pi-sysroot/usr/lib/aarch64-linux-gnu/
#   rsync -avz <pi>:/usr/lib/aarch64-linux-gnu/pkgconfig/{gstreamer*,gst*,glib*,gobject*,gio*}.pc \
#     ~/pi-sysroot/usr/lib/aarch64-linux-gnu/pkgconfig/
#   rsync -avz <pi>:'/usr/lib/aarch64-linux-gnu/libgst*' \
#     ~/pi-sysroot/usr/lib/aarch64-linux-gnu/
# Renamed (package = "...") so src refers to the conventional
# short names (`gst::`, `gst_app::`, `gst_video::`, `gst_gl::`,
# `gst_gl_egl::`) that mirror the upstream Rust docs.
gst        = { package = "gstreamer",        version = "0.23" }
gst_app    = { package = "gstreamer-app",    version = "0.23" }
gst_video  = { package = "gstreamer-video",  version = "0.23" }
gst_gl     = { package = "gstreamer-gl",     version = "0.23" }
gst_gl_egl = { package = "gstreamer-gl-egl", version = "0.23" }

[profile.release]
opt-level = 3
lto       = "thin"
strip     = "symbols"

[[bin]]
name = "blendr"
path = "src/main.rs"
