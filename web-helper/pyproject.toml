[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openmarquee-web-helper"
version = "0.1.0"
description = "Standalone screenshot helper for the openMarquee Web slide"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "openMarquee contributors" },
]
# This is a SEPARATELY-PACKAGED component. It deliberately does not
# depend on (nor import from) the `openmarquee` backend package -- it
# runs on the operator's own capable machine, not on the Pi.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # Playwright drives a headless Chromium to render pages. The
    # browser binary itself is installed out-of-band via
    # `playwright install chromium` (documented for the operator in
    # commit H2's README).
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # FastAPI's TestClient is backed by httpx.
    "httpx>=0.27",
]

[project.scripts]
openmarquee-web-helper = "openmarquee_web_helper.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openmarquee_web_helper*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
