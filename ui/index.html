<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>openMarquee</title>
    <!-- PWA "bookmark moment" 2026-07-01: manifest + apple-touch-icon
         let a phone that navigates here after onboarding install the
         dashboard as a home-screen tile. See qa/spec-onboarding-ap-
         sta-concurrent-2026-06-10.md §"Finding the device after
         onboarding" #2. The prompt itself is mounted on welcome.html
         (LINGER landing); dashboard just carries the manifest so
         a later revisit can still trigger Add-to-Home-Screen. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="/icons/monogram.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png">
    <meta name="theme-color" content="#ffb43c">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="om-app" data-theme="dark" data-accent="amber" data-density="compact" data-layout="desktop">

    <!-- Sidebar — Wordmark, Flock card, Library section, Device section,
         version footer. main.js fills the dynamic bits (peer dot row,
         online count) once it can hit /api/flock + /api/settings. -->
    <nav class="om-side" aria-label="Primary">
        <div style="padding: 4px 8px 14px;">
            <span class="om-wordmark om-wordmark-stack">
                <span class="om-mark"></span>
                <span class="om-wm-stack">
                    <span class="om-wm-pre">OPEN</span>
                    <span class="om-wm-post"><em>M</em>arquee</span>
                </span>
            </span>
        </div>

        <a class="om-side-item om-flock nav-link" href="#/flock" data-section="flock">
            <div class="om-flock-head">
                <span class="om-side-icon" data-icon="flock"></span>
                <span class="om-flock-name">Flock</span>
                <span class="om-pill live"><span class="om-pulse"></span>live</span>
            </div>
            <div class="om-flock-stats">
                <span data-flock-count>– / – online</span>
                <span style="color: var(--om-text-fade);">·</span>
                <span data-flock-since>just now</span>
                <div style="margin-left: auto;">
                    <div class="om-flock-dots" data-flock-dots></div>
                </div>
            </div>
        </a>

        <div class="om-side-section">Library</div>
        <a class="om-side-item nav-link" href="#/slides" data-section="slides">
            <span class="om-side-icon" data-icon="slides"></span>
            <span style="flex: 1;">Slides</span>
            <span class="om-count" data-slide-count>·</span>
        </a>
        <a class="om-side-item nav-link" href="#/playlists" data-section="playlists">
            <span class="om-side-icon" data-icon="playlist"></span>
            <span style="flex: 1;">Playlists</span>
            <span class="om-count" data-playlist-count>·</span>
        </a>
        <a class="om-side-item nav-link" href="#/live" data-section="live">
            <span class="om-side-icon" data-icon="live"></span>
            <span style="flex: 1;">Live</span>
        </a>
        <a class="om-side-item nav-link" href="#/schedule" data-section="schedule">
            <span class="om-side-icon" data-icon="schedule"></span>
            <span style="flex: 1;">Schedule</span>
        </a>

        <div class="om-side-section">Device</div>
        <a class="om-side-item nav-link" href="#/settings" data-section="settings">
            <span class="om-side-icon" data-icon="settings"></span>
            <span style="flex: 1;">Settings</span>
        </a>

        <div style="margin-top: auto; padding: 14px 8px 4px; font-family: var(--om-mono); font-size: 10.5px; color: var(--om-text-fade); letter-spacing: 0.04em;">
            openMarquee 0.7.0-rc.1 · GPLv3
        </div>
    </nav>

    <main class="om-main">
        <div class="om-topbar">
            <button class="om-btn ghost icon sm om-sheet-open" type="button"
                    aria-label="Open menu" data-icon="menu"></button>
            <div class="om-topbar-title">
                <b data-sign-name>openMarquee</b>
                <span class="om-divider"></span>
                <span data-section-title>Slides</span>
            </div>
            <span class="om-pill live"><span class="om-pulse"></span>broadcasting</span>
            <span class="om-pill" data-peer-pill title="Signs online">
                <span data-icon="flock-pill"></span>
                <span data-peer-pill-text>– / –</span>
            </span>
        </div>
        <!-- Global error-boundary backstop (audit finding #8, 2026-05-25).
             Panel-level status pills (finding #3-#7 fixes) stay; this is
             the catch-all for uncaught throws + unhandled rejections. -->
        <div class="om-error-banner" data-error-banner role="alert" aria-live="assertive" hidden>
            <span class="om-error-banner-message" data-error-banner-message></span>
            <button class="om-error-banner-dismiss" data-error-banner-dismiss type="button" aria-label="Dismiss error">×</button>
        </div>

        <div class="om-scroll" id="app">
            <p class="status">Loading…</p>
        </div>
    </main>

    <script type="module" src="/dist/main.js"></script>
</body>
</html>
