<!doctype html>
<!--
    Device simulator — a pop-out window showing what the sign content
    would look like on the device configured in Settings. Opened from
    the Playlists panel's "Open simulator" button via window.open; runs
    standalone with its own bundle. Polls the MockRenderer's latest
    frame at /dev/preview/frame.png and draws it per the current
    output_mode:

    - hdmi / composite: bare pixel-accurate scaling into a window
      sized to the configured display aspect ratio.
    - hub75: each source pixel rendered as a gapped square on a
      dark-panel background — the LED-matrix look.
    - ws281x: each source pixel rendered as a glowing circle on a
      near-black background — the addressable-strip look.

    The point isn't pixel-perfect hardware simulation; it's "see the
    sign content in something that visually reads as its target
    device" so the demo (and QA before hardware arrives) makes sense
    without a Pi on the desk.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>openMarquee — device simulator</title>
    <style>
        :root {
            --bg: #000;
            --text: #e9e9ec;
            --muted: #8b8b92;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        .simulator {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas.simulator-canvas {
            display: block;
            /* Pixel-accurate scaling so the sign content doesn't get
               filter-softened. Each skin handles its own backdrop. */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            max-height: 100%;
        }
        .simulator-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 0.75rem;
            color: var(--muted);
            font-size: 0.95rem;
            text-align: center;
            padding: 2rem;
            pointer-events: none;
        }
        .simulator-placeholder.hidden { display: none; }
        .simulator-mode {
            position: fixed;
            top: 0.5rem;
            right: 0.75rem;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            background: rgba(0, 0, 0, 0.55);
            padding: 0.2rem 0.5rem;
            border-radius: 0.3rem;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <main class="simulator">
        <canvas class="simulator-canvas" aria-label="device simulation"></canvas>
        <div class="simulator-placeholder">
            <strong>Press <em>Play all</em> in the main window</strong>
            <span>to see your sign's content here.</span>
        </div>
        <div class="simulator-mode" data-field="mode"></div>
    </main>
    <script type="module" src="/dist/simulator.js"></script>
</body>
</html>
